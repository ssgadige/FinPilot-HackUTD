name: Expanded demo seed validation
on:
  pull_request:
    paths:
      - scripts/seed_expanded_demo.py
      - scripts/seed_demo.py
      - data/schema.sql
      - tests/test_expanded_seed.py
      - .github/workflows/expanded-seed-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_expanded_seed.py' -v
